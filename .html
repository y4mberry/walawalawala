<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <style>
        body {
            background-color: #f6ff75;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            flex-direction: column;
            overflow: hidden;
        }
        .message {
            background-color: #e92a2a;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: none; /* Hidden initially */
        }
        h1 {
            font-size: 50px;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.7);
        }
        button {
            padding: 10px 25px;
            background-color: #ff6257;
            color: rgb(255, 251, 251);
            font-size: 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #f0669b;
            transform: scale(1.1);
        }

        /* Heart animation */
        .heart {
            position: absolute;
            font-size: 30px;
            animation: float 5s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
            }
        }

        /* Floating hearts */
        .heart:nth-child(odd) {
            animation-duration: 7s;
            animation-delay: -2s;
        }
        .heart:nth-child(even) {
            animation-duration: 6s;
            animation-delay: -3s;
        }

        /* Spotify iframe style */
        iframe {
            border: none;
            margin-top: 30px;
            width: 300px;
            height: 380px;
            display: none; /* Hidden initially */
        }

        /* Styling for the image */
        .valentine-photo {
            width: 300px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>

    <!-- Add an image here -->
    <img src="3790da1391f92b332536b0354592411c.jpg" alt="Valentine's Day" class="valentine-photo">

    <button onclick="toggleMessage()">Message</button>

    <div id="message" class="message">
        <p>HAPPY VALENTINES RY! SORRY ETO LANG MERON AKONG MAIBIBIGAY NA GIFT FOR YOU.
             GALINGAN MO LAGI SA SCHOOL NANDITO LANG ME 
             DI KITA KINAKALIMUTAN HEHE I LOVE YOU. ❤️</p>
        <button onclick="toggleMessage()">Close</button>
    </div>

    <!-- Floating hearts -->
    <div class="heart" style="top: 10%; left: 20%;">❤️</div>
    <div class="heart" style="top: 25%; left: 70%;">❤️</div>
    <div class="heart" style="top: 50%; left: 30%;">❤️</div>
    <div class="heart" style="top: 60%; left: 80%;">❤️</div>
    <div class="heart" style="top: 80%; left: 40%;">❤️</div>

    <!-- Spotify Playlist button -->
    <button onclick="togglePlaylist()">Playlist</button>

    <!-- Embed Spotify Playlist (Initially Hidden) -->
    <iframe id="spotifyPlaylist" src="https://open.spotify.com/embed/playlist/3I3dcybfMlBiA4pwYZkSBh?si=c6b9fbdfee6f4dd2" width="300" height="380" frameborder="0" allow="encrypted-media"></iframe>

    <script>
        function toggleMessage() {
            var messageElement = document.getElementById("message");
            // Toggle visibility of the message
            if (messageElement.style.display === "none" || messageElement.style.display === "") {
                messageElement.style.display = "block";
            } else {
                messageElement.style.display = "none";
            }
        }

        function togglePlaylist() {
            var playlistElement = document.getElementById("spotifyPlaylist");
            // Toggle visibility of the playlist
            if (playlistElement.style.display === "none" || playlistElement.style.display === "") {
                playlistElement.style.display = "block";
            } else {
                playlistElement.style.display = "none";
            }
        }
    </script>
</body>
</html>
